name: Bug Report
description: Something isn't working right, but the app hasn't crashed.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: check [KnownIssues.md](https://github.com/hvtim/FeatherRPC/blob/main/docs/KnownIssues.md)
        and search existing issues - your report may already be covered.

        Then, in the tray's right-click menu, click **Copy Diagnostic Info**
        and paste the result below. See
        [CONTRIBUTING.md#reporting-bugs](https://github.com/hvtim/FeatherRPC/blob/main/CONTRIBUTING.md#reporting-bugs)
        for what that includes and why it's almost always everything we need
        in one paste.

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I'm running the latest release.
          required: true
        - label: I checked KnownIssues.md - this doesn't look like an already-documented limitation or fixed bug.
          required: true
        - label: I searched existing issues - this doesn't look like a duplicate.
          required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true

  - type: textarea
    id: diagnostic-info
    attributes:
      label: Diagnostic Info
      description: Paste the full output of the tray menu's "Copy Diagnostic Info" here.
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: As detailed as you can manage - the more exact, the faster this gets fixed.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
