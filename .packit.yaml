# Fires a COPR build (hvtim/featherrpc) on GitHub Release publish, not on
# every commit - separate from COPR's own "Auto-rebuild" toggle (left off),
# which would rebuild on every commit instead. Requires the Packit GitHub
# App installed on this repo. `targets` must match the COPR project's
# enabled chroots. See docs/Releasing.md.
specfile_path: packaging/copr/featherrpc.spec
upstream_package_name: featherrpc
downstream_package_name: featherrpc
upstream_tag_template: v{version}

jobs:
  - job: copr_build
    trigger: release
    owner: hvtim
    project: featherrpc
    targets:
      - fedora-44-x86_64
      - fedora-43-x86_64
      - fedora-44-aarch64
      - fedora-43-aarch64
